<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ settings.business_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand">📒 {{ settings.business_name }}</div>
    <nav>
      {% set page = request.endpoint %}
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if page == 'dashboard' }}">📊 Dashboard</a>
      <a href="{{ url_for('sales') }}" class="{{ 'on' if page == 'sales' }}">💰 Sales</a>
      <a href="{{ url_for('purchases') }}" class="{{ 'on' if page == 'purchases' }}">🛒 Purchases</a>
      <a href="{{ url_for('parts') }}" class="{{ 'on' if page == 'parts' }}">🔩 Parts</a>
      <a href="{{ url_for('customers') }}" class="{{ 'on' if page == 'customers' }}">🧑 Customers</a>
      <a href="{{ url_for('suppliers') }}" class="{{ 'on' if page == 'suppliers' }}">🏭 Suppliers</a>
      <a href="{{ url_for('settings_page') }}" class="{{ 'on' if page == 'settings_page' }}">⚙️ Settings</a>
    </nav>
  </header>
  <main>
    {% for kind, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ kind }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
